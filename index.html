<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>⚡ 极速数据处理 - 手机修复版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        /* 所有样式保持不变，与您原来的一致 */
        * { box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #e6f0fa 0%, #b8d9f5 100%); margin: 0; padding: 10px; color: #333; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
        .container { width: 100%; max-width: 1300px; margin: 0 auto; background-color: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); padding: 20px; position: relative; overflow: hidden; }
        @media (min-width: 768px) { .container { padding: 35px; } }
        @media (max-width: 480px) { .container { padding: 15px; border-radius: 12px; } body { padding: 5px; } }
        .container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, #4d90fe, #34a853, #fbbc05, #ea4335); }
        h1 { color: #2c3e50; text-align: center; margin-top: 0; padding-bottom: 15px; border-bottom: 1px solid #eaeaea; font-weight: 700; position: relative; font-size: clamp(1.5rem, 5vw, 2.5rem); }
        @media (max-width: 480px) { h1 { padding-bottom: 10px; margin-bottom: 15px; } }
        h1::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100px; max-width: 30%; height: 4px; background: linear-gradient(90deg, #4d90fe, #34a853); border-radius: 2px; }
        .tool-tabs { display: flex; background: linear-gradient(135deg, #f8f9fa, #e9ecef); border-radius: 12px; padding: 5px; margin-bottom: 20px; flex-wrap: wrap; gap: 5px; }
        .tool-tab { flex: 1 1 auto; min-width: 120px; padding: 12px 15px; text-align: center; cursor: pointer; font-weight: 600; border-radius: 8px; transition: all 0.3s; color: #666; font-size: clamp(0.9rem, 3vw, 1rem); white-space: nowrap; }
        @media (max-width: 600px) { .tool-tab { min-width: calc(50% - 5px); white-space: normal; padding: 10px 8px; font-size: 0.9rem; } }
        .tool-tab:hover { background-color: rgba(255, 255, 255, 0.5); }
        .tool-tab.active { background-color: white; color: #4d90fe; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1); }
        .tool-panel { display: none; }
        .tool-panel.active { display: block; animation: fadeIn 0.5s ease; }
        .input-section { margin-bottom: 25px; }
        .input-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .input-group { flex: 1 1 250px; min-width: 250px; }
        @media (max-width: 600px) { .input-group { min-width: 100%; } .input-row { gap: 15px; } }
        .input-label { display: block; font-weight: 600; margin-bottom: 8px; color: #444; font-size: clamp(0.95rem, 3vw, 1rem); }
        .filename-input, .number-input { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: all 0.3s; -webkit-appearance: none; appearance: none; }
        @media (max-width: 480px) { .filename-input, .number-input { padding: 10px 12px; font-size: 15px; } }
        .filename-input:focus, .number-input:focus { border-color: #4d90fe; box-shadow: 0 0 0 3px rgba(77, 144, 254, 0.2); outline: none; }
        .filename-hint { font-size: 13px; color: #666; margin-top: 6px; }
        .quick-buttons, .column-quick-buttons, .action-buttons, .filename-prefix-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .quick-btn, .column-quick-btn, .action-btn, .prefix-btn { padding: 6px 12px; background: linear-gradient(135deg, #f8f9fa, #e9ecef); border: 1px solid #d0d7de; border-radius: 16px; font-size: 14px; font-weight: 600; color: #444; cursor: pointer; transition: all 0.2s; flex: 0 1 auto; }
        @media (max-width: 480px) { .quick-btn, .column-quick-btn, .action-btn, .prefix-btn { padding: 8px 10px; font-size: 13px; flex: 1 1 calc(33.333% - 6px); text-align: center; } }
        .quick-btn:hover, .column-quick-btn:hover, .action-btn:hover, .prefix-btn:hover { background: linear-gradient(135deg, #e2e6ea, #d0d7de); transform: translateY(-1px); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .quick-btn.active, .column-quick-btn.active, .prefix-btn.active { background: linear-gradient(135deg, #4d90fe, #357ae8); color: white; border-color: #4d90fe; }
        .action-btn.add-zero { background: linear-gradient(135deg, #34a853, #2e8b47); color: white; border-color: #2e8b47; }
        .action-btn.remove-zero { background: linear-gradient(135deg, #f44336, #d32f2f); color: white; border-color: #d32f2f; }
        .action-btn.insert-first { background: linear-gradient(135deg, #4d90fe, #357ae8); color: white; border-color: #357ae8; }
        .action-btn.delete-first { background: linear-gradient(135deg, #ea4335, #d32f2f); color: white; border-color: #d32f2f; }
        .column-radio-hidden { display: none; }
        .label-with-btn { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
        .label-with-btn .input-label { margin-bottom: 0; }
        .add-prefix-btn { background: linear-gradient(135deg, #f44336, #d32f2f); color: white; border: none; border-radius: 24px; padding: 5px 18px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 6px rgba(244, 67, 54, 0.3); display: inline-flex; align-items: center; gap: 4px; letter-spacing: 0.5px; line-height: 1.4; }
        .add-prefix-btn:hover { background: linear-gradient(135deg, #e53935, #c62828); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(244, 67, 54, 0.4); }
        .filename-auto-hint { font-size: 12px; color: #4d90fe; margin-top: 4px; font-style: italic; font-weight: 500; }
        textarea { width: 100%; min-height: 250px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; line-height: 1.5; resize: vertical; transition: all 0.3s; -webkit-appearance: none; appearance: none; }
        @media (max-width: 480px) { textarea { min-height: 180px; padding: 12px; font-size: 15px; } }
        textarea:focus { border-color: #4d90fe; box-shadow: 0 0 0 3px rgba(77, 144, 254, 0.2); outline: none; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        button { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: 0 1 auto; min-width: 140px; }
        @media (max-width: 600px) { button { width: 100%; padding: 12px 16px; font-size: 15px; min-width: auto; } .controls { gap: 10px; } }
