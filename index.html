<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>终极测试</title>
</head>
<body>
    <h3>测试：生成并下载</h3>
    <button id="genBtn">生成文件</button>
    <div id="list"></div>

    <script>
        let fileId = 0;
        const listDiv = document.getElementById('list');
        
        // 下载函数
        function download(content, filename) {
            const blob = new Blob([content], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }
        
        // 生成按钮
        document.getElementById('genBtn').onclick = function() {
            fileId++;
            const filename = 'test_' + fileId + '.txt';
            const content = '这是第' + fileId + '个文件的内容\n行1\n行2\n行3';
            
            // 添加到列表
            const item = document.createElement('div');
            item.innerHTML = `<span>${filename}</span> <button class="download-btn" data-content="${content}" data-name="${filename}">下载</button>`;
            listDiv.appendChild(item);
            
            // 自动下载
            download(content, filename);
        };
        
        // 事件委托
        listDiv.addEventListener('click', function(e) {
            const btn = e.target.closest('.download-btn');
            if(btn) {
                const content = btn.dataset.content;
                const name = btn.dataset.name;
                download(content, name);
                alert('下载: ' + name);
            }
        });
    </script>
</body>
</html>
