<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
</head>
<body>
    <h3>测试1: 普通按钮</h3>
    <button id="btn1">点我 (onclick)</button>
    <span id="count1">0</span>
    
    <h3>测试2: 动态生成按钮</h3>
    <button id="createBtn">生成新按钮</button>
    <div id="dynamicArea"></div>
    <span id="count2">0</span>
    
    <script>
        // 测试1: 普通按钮
        let c1 = 0;
        document.getElementById('btn1').onclick = function() {
            c1++;
            document.getElementById('count1').innerHTML = c1;
        };
        
        // 测试2: 动态生成按钮 - 使用事件委托
        let c2 = 0;
        const dynamicArea = document.getElementById('dynamicArea');
        const count2Span = document.getElementById('count2');
        
        // 事件委托
        dynamicArea.addEventListener('click', function(e) {
            if(e.target.classList.contains('dynamic-btn')) {
                c2++;
                count2Span.innerHTML = c2;
            }
        });
        
        // 生成按钮
        document.getElementById('createBtn').onclick = function() {
            const btn = document.createElement('button');
            btn.className = 'dynamic-btn';
            btn.textContent = '动态按钮 - 点我';
            dynamicArea.appendChild(btn);
        };
        
        // 初始生成一个按钮
        const initBtn = document.createElement('button');
        initBtn.className = 'dynamic-btn';
        initBtn.textContent = '动态按钮 - 点我';
        dynamicArea.appendChild(initBtn);
    </script>
</body>
</html>
