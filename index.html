<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>号码工具 - 手机稳定版</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 16px; }
        .app { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 20px; }
        .header h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin-bottom: 8px; }
        .tabs { display: flex; flex-wrap: wrap; gap: 8px; background: rgba(255,255,255,0.15); border-radius: 16px; padding: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; min-width: 100px; padding: 12px; background: transparent; border: none; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: white; color: #667eea; }
        .panel { display: none; background: white; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .panel.active { display: block; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; }
        textarea { min-height: 120px; font-family: monospace; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
        button { padding: 12px 20px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .quick-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .quick-btn { padding: 6px 12px; background: #f0f0f0; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .quick-btn.active { background: #667eea; color: white; }
        .status-bar { background: #f8f9fa; border-radius: 12px; padding: 12px; margin: 12px 0; font-size: 14px; }
        .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin: 12px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); width: 0%; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; margin: 16px 0; }
        .stat-card { background: #f8f9fa; padding: 12px; border-radius: 12px; text-align: center; }
        .stat-number { font-size: 24px; font-weight: bold; color: #667eea; }
        .file-list { max-height: 300px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 12px; margin-top: 16px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; gap: 8px; }
        .result-card { background: #f8f9fa; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .upload-area { border: 2px dashed #cbd5e0; border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; margin-bottom: 16px; }
        .row { display: flex; gap: 16px; flex-wrap: wrap; }
        .row > * { flex: 1; min-width: 180px; }
        .note { background: #fff3e0; padding: 12px; border-radius: 12px; font-size: 12px; margin-top: 16px; }
        @media (max-width: 640px) { .panel { padding: 16px; } button { flex: 1; } }
        .loading { display: none; text-align: center; padding: 20px; }
        .spinner { width: 30px; height: 30px; border: 3px solid #f0f0f0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>📞 号码处理工具</h1>
        <p>批量生成 · 去重 · 分类 · 对比</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-panel="gen">📁 批量生成</button>
        <button class="tab-btn" data-panel="dedup">🔍 单文件去重</button>
        <button class="tab-btn" data-panel="classify">📂 前缀分类</button>
        <button class="tab-btn" data-panel="dup">🔄 双文件去重</button>
        <button class="tab-btn" data-panel="zero">0️⃣ 前导0</button>
        <button class="tab-btn" data-panel="first">⬅️ 首列编辑</button>
    </div>

    <!-- 批量生成 -->
    <div id="panel-gen" class="panel active">
        <div class="row">
            <div class="form-group"><label>文件名</label><input type="text" id="gen-filename" placeholder="自动识别"></div>
            <div class="form-group"><label>每文件量</label>
                <div class="quick-btns" id="gen-quick-size">
                    <span class="quick-btn" data-val="5">5万</span>
                    <span class="quick-btn active" data-val="10">10万</span>
                    <span class="quick-btn" data-val="20">20万</span>
                    <span class="quick-btn" data-val="30">30万</span>
                </div>
            </div>
            <div class="form-group"><label>数据列</label>
                <div class="quick-btns" id="gen-quick-col">
                    <span class="quick-btn active" data-col="first">第一列</span>
                    <span class="quick-btn" data-col="second">第二列</span>
                </div>
            </div>
        </div>
        <div class="form-group"><label>区号识别</label>
            <div class="quick-btns"><span class="quick-btn active" id="gen-area-on">开启</span><span class="quick-btn" id="gen-area-off">关闭</span></div>
        </div>
        <div class="form-group"><label>号码段规则</label><textarea id="gen-rules">开头
023</textarea></div>
        <div class="btn-group">
            <button class="btn-primary" id="gen-txt-btn">📄 生成TXT</button>
            <button class="btn-primary" id="gen-excel-btn">📊 生成Excel</button>
            <button class="btn-secondary" id="gen-reset">重置</button>
        </div>
        <div class="status-bar"><span id="gen-status">等待生成</span><span id="gen-stats"></span></div>
        <div class="progress-bar"><div class="progress-fill" id="gen-progress"></div></div>
        <div class="loading" id="gen-loading"><div class="spinner"></div>生成中...</div>
        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="stat-total">0</div><div>总数据</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-files">0</div><div>文件数</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-groups">0</div><div>号码组</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-unique">0</div><div>去重后</div></div>
        </div>
        <div class="file-list" id="gen-filelist"></div>
    </div>

    <!-- 单文件去重 -->
    <div id="panel-dedup" class="panel">
        <div class="upload-area" id="dedup-area"><div>📤 点击或拖拽上传文件</div><div style="font-size:12px">支持 xlsx/xls/txt/csv (可多选)</div></div>
        <div class="progress-bar"><div class="progress-fill" id="dedup-progress"></div></div>
        <div id="dedup-results"></div>
        <button class="btn-secondary" id="dedup-reset">清空</button>
    </div>

    <!-- 前缀分类 -->
    <div id="panel-classify" class="panel">
        <div class="row">
            <div class="form-group"><label>前缀长度</label><select id="classify-len"><option value="3">3位</option><option value="4" selected>4位</option><option value="5">5位</option></select></div>
            <div class="form-group"><label>排序</label><div class="quick-btns"><span class="quick-btn active" id="sort-asc">升序</span><span class="quick-btn" id="sort-shuffle">随机</span></div></div>
            <div class="form-group"><label>文件名前缀</label><div class="quick-btns"><span class="quick-btn active" data-prefix="">无</span><span class="quick-btn" data-prefix="家庭">家庭</span><span class="quick-btn" data-prefix="公司">公司</span></div></div>
        </div>
        <div class="row">
            <div class="form-group"><label>提取列</label><div class="quick-btns"><span class="quick-btn active" data-class-col="first">第一列</span><span class="quick-btn" data-class-col="second">第二列</span></div></div>
            <div class="form-group"><label>区号识别</label><div class="quick-btns"><span class="quick-btn active" id="classify-area-on">开启</span><span class="quick-btn" id="classify-area-off">关闭</span></div></div>
        </div>
        <div class="upload-area" id="classify-area"><div>📁 点击或拖拽上传文件</div></div>
        <div class="progress-bar"><div class="progress-fill" id="classify-progress"></div></div>
        <div id="classify-stats" class="stats" style="display:none"></div>
        <div id="classify-list"></div>
        <div class="btn-group"><button class="btn-primary" id="classify-all-txt">下载所有TXT</button><button class="btn-primary" id="classify-all-xlsx">下载所有Excel</button><button class="btn-secondary" id="classify-reset">重置</button></div>
    </div>

    <!-- 双文件去重 -->
    <div id="panel-dup" class="panel">
        <div class="row">
            <div class="upload-area" id="dup-area1"><div>📁 文件1</div><div id="dup-name1">未选择</div></div>
            <div class="upload-area" id="dup-area2"><div>📁 文件2</div><div id="dup-name2">未选择</div></div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="dup-progress"></div></div>
        <div class="btn-group"><button class="btn-primary" id="dup-process" disabled>处理并下载</button><button class="btn-secondary" id="dup-clear">清空</button></div>
        <div id="dup-download" style="display:none; margin-top:16px"><div class="result-card"><div class="result-actions"><button class="btn-primary" id="dup-dl1-txt">文件1 TXT</button><button class="btn-primary" id="dup-dl1-xlsx">文件1 Excel</button><button class="btn-primary" id="dup-dl2-txt">文件2 TXT</button><button class="btn-primary" id="dup-dl2-xlsx">文件2 Excel</button></div></div></div>
    </div>

    <!-- 前导0 -->
    <div id="panel-zero" class="panel">
        <div class="upload-area" id="zero-area"><div>📤 点击或拖拽上传文件</div></div>
        <div class="row">
            <div class="form-group"><label>操作列</label><div class="quick-btns"><span class="quick-btn active" data-zero-col="first">第一列</span><span class="quick-btn" data-zero-col="second">第二列</span></div></div>
        </div>
        <div class="btn-group"><button class="btn-primary" id="zero-add">➕ 添加前导0</button><button class="btn-primary" id="zero-remove">➖ 删除前导0</button></div>
        <div class="progress-bar"><div class="progress-fill" id="zero-progress"></div></div>
        <div id="zero-results"></div>
        <button class="btn-secondary" id="zero-reset">清空</button>
    </div>

    <!-- 首列编辑 -->
    <div id="panel-first" class="panel">
        <div class="upload-area" id="first-area"><div>📤 点击或拖拽上传文件</div></div>
        <div class="btn-group"><button class="btn-primary" id="first-insert">➕ 插入空白列</button><button class="btn-primary" id="first-delete">✖ 删除第一列</button></div>
        <div class="progress-bar"><div class="progress-fill" id="first-progress"></div></div>
        <div id="first-results"></div>
        <button class="btn-secondary" id="first-reset">清空</button>
    </div>

    <div class="note">💡 手机模式已优化，所有下载按钮使用全局函数，连续点击有效</div>
</div>

<script>
// ========== 全局存储 ==========
window.fileData = {};
let nextId = 1;

// ========== 区号映射 ==========
const areaMap = {
    '010':'北京','021':'上海','022':'天津','023':'重庆','024':'沈阳','025':'南京','027':'武汉','028':'成都','029':'西安',
    '0311':'石家庄','0371':'郑州','0411':'大连','0431':'长春','0451':'哈尔滨','0512':'苏州','0513':'南通','0514':'扬州',
    '0515':'盐城','0516':'徐州','0517':'淮安','0518':'连云港','0519':'常州','0531':'济南','0532':'青岛','0551':'合肥',
    '0571':'杭州','0574':'宁波','0577':'温州','0591':'福州','0592':'厦门','0731':'长沙','0755':'深圳','0756':'珠海',
    '0757':'佛山','0769':'东莞'
};
function getArea(p) { return areaMap[p] || areaMap[p?.slice(0,3)] || areaMap[p?.slice(0,4)] || null; }

// ========== 下载函数 ==========
function downloadFile(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function makeExcel(data, simple) {
    const sheet = simple ? data.map(v=>[v]) : data;
    const ws = XLSX.utils.aoa_to_sheet(sheet);
    ws['!cols'] = [{wch:20}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '数据');
    return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})], {type:'application/octet-stream'});
}

// 解析文件
function readFile(file, col, callback) {
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();
    reader.onload = e => {
        try {
            let data = [];
            if(ext === 'xlsx' || ext === 'xls') {
                const wb = XLSX.read(e.target.result, {type:'binary'});
                const sheet = wb.Sheets[wb.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, {header:1});
                for(let row of rows) {
                    let v = row[col];
                    if(v && v.toString().trim()) data.push(v.toString().trim());
                }
            } else {
                const lines = e.target.result.split(/\r?\n/);
                for(let line of lines) if(line.trim()) data.push(line.trim());
            }
            callback(null, data);
        } catch(err) { callback(err, null); }
    };
    if(ext === 'xlsx' || ext === 'xls') reader.readAsBinaryString(file);
    else reader.readAsText(file, 'UTF-8');
}

function readFileFull(file, callback) {
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();
    reader.onload = e => {
        try {
            let data = [];
            if(ext === 'xlsx' || ext === 'xls') {
                const wb = XLSX.read(e.target.result, {type:'binary'});
                const sheet = wb.Sheets[wb.SheetNames[0]];
                data = XLSX.utils.sheet_to_json(sheet, {header:1});
            } else {
                const lines = e.target.result.split(/\r?\n/);
                for(let line of lines) if(line.trim()) data.push([line.trim()]);
            }
            callback(null, data);
        } catch(err) { callback(err, null); }
    };
    if(ext === 'xlsx' || ext === 'xls') reader.readAsBinaryString(file);
    else reader.readAsText(file, 'UTF-8');
}

function unique(arr) { return [...new Set(arr)]; }
function shuffle(arr) { for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

// ========== 批量生成 ==========
let genAreaOn = true;
let genLastManual = '';
const genFilename = document.getElementById('gen-filename');
const genRules = document.getElementById('gen-rules');
const genStatus = document.getElementById('gen-status');
const genProgress = document.getElementById('gen-progress');
const genLoading = document.getElementById('gen-loading');
const genFilelist = document.getElementById('gen-filelist');

function updateGenName() {
    let prefixes = [];
    const lines = genRules.value.split(/\r?\n/);
    for(let line of lines) {
        let m = line.match(/^开头\s*(\d+)/);
        if(m) prefixes.push(m[1]);
    }
    prefixes = [...new Set(prefixes)];
    if(prefixes.length) {
        let suggest;
        if(genAreaOn) suggest = prefixes.map(p => { let a = getArea(p); return a ? `${p}(${a})` : p; }).join('-');
        else suggest = prefixes.join('-');
        if(!genLastManual || genFilename.value === genLastManual || genFilename.value === '') {
            genFilename.value = suggest;
            genLastManual = suggest;
        }
    }
}

function parseRules() {
    const text = genRules.value.replace(/[\u200B-\u200D\uFEFF]/g, '');
    const lines = text.split(/\r?\n/);
    const result = {};
    let cur = null;
    for(let line of lines) {
        line = line.trim();
        if(!line) continue;
        if(line === '开头') { cur = null; continue; }
        let m = line.match(/^开头\s*(\d+)/);
        if(m) { cur = m[1]; if(!result[cur]) result[cur]=[]; continue; }
        if(/^\d+$/.test(line)) {
            if(cur === null) { cur = line; if(!result[cur]) result[cur]=[]; }
            else result[cur].push(line.padStart(3,'0'));
            continue;
        }
        let range = line.match(/^(\d+)\s*(?:-|～|到)\s*(\d+)$/);
        if(range && cur) {
            let start = range[1], end = range[2];
            if(end.length < start.length) end = start.slice(0, start.length-end.length) + end;
            for(let i=parseInt(start); i<=parseInt(end); i++) result[cur].push(i.toString().padStart(3,'0'));
        }
    }
    return result;
}

function genNumbers(data) {
    let nums = [];
    for(let p in data) {
        for(let m of data[p]) {
            let pm = p + m;
            for(let k=1;k<=9999;k++) nums.push(pm + k.toString().padStart(4,'0'));
        }
    }
    return nums;
}

function doGenerate(format) {
    const filename = genFilename.value.trim() || '号码数据';
    const perFile = (parseInt(document.querySelector('#gen-quick-size .quick-btn.active')?.dataset.val || '10')) * 10000;
    const colPos = document.querySelector('#gen-quick-col .quick-btn.active')?.dataset.col || 'first';
    genLoading.style.display = 'block';
    genFilelist.innerHTML = '';
    genStatus.textContent = '解析...';
    genProgress.style.width = '10%';
    setTimeout(() => {
        try {
            const parsed = parseRules();
            let groups = 0;
            for(let k in parsed) groups += parsed[k].length;
            if(groups===0) { alert('无效号码段'); genLoading.style.display='none'; return; }
            genStatus.textContent = '生成...';
            genProgress.style.width = '30%';
            let all = genNumbers(parsed);
            genStatus.textContent = '打乱...';
            genProgress.style.width = '50%';
            let shuffled = shuffle(all);
            genStatus.textContent = '去重...';
            genProgress.style.width = '70%';
            let uniqueArr = unique(shuffled);
            let totalFiles = Math.ceil(uniqueArr.length/perFile);
            document.getElementById('stat-total').textContent = all.length.toLocaleString();
            document.getElementById('stat-files').textContent = totalFiles;
            document.getElementById('stat-groups').textContent = groups;
            document.getElementById('stat-unique').textContent = uniqueArr.length.toLocaleString();
            for(let i=0;i<totalFiles;i++) {
                let start = i*perFile;
                let end = Math.min(start+perFile, uniqueArr.length);
                let nums = uniqueArr.slice(start,end);
                let suffix = colPos==='second'?'_第二列':'';
                let ext = format==='txt'?'.txt':'.xlsx';
                let name = i===0?`${filename}${suffix}${ext}`:`${filename}${suffix}_${i+1}${ext}`;
                const id = nextId++;
                window.fileData[id] = { nums, colPos, format, name };
                if(format==='txt') {
                    let content = colPos==='first'?nums.join('\n'):nums.map(v=>'\t'+v).join('\n');
                    downloadFile(new Blob([content],{type:'text/plain'}), name);
                } else {
                    let data = colPos==='first'?nums.map(v=>[v]):nums.map(v=>['',v]);
                    downloadFile(makeExcel(data,false), name);
                }
                let item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `<span><strong>${name}</strong> (${nums.length}条)</span><button class="btn-primary" onclick="downloadById(${id}, '${name}')">⬇️下载</button>`;
                genFilelist.appendChild(item);
                genProgress.style.width = 85 + ((i+1)/totalFiles * 15) + '%';
                genStatus.textContent = `文件 ${i+1}/${totalFiles}`;
            }
            genStatus.textContent = '完成';
            genProgress.style.width = '100%';
            genLoading.style.display = 'none';
        } catch(e) { alert('错误:'+e.message); genLoading.style.display='none'; }
    }, 50);
}

// 全局下载函数 - 供 onclick 调用
window.downloadById = function(id, name) {
    let data = window.fileData[id];
    if(data) {
        if(data.format === 'txt') {
            let content = data.colPos === 'first' ? data.nums.join('\n') : data.nums.map(v=>'\t'+v).join('\n');
            downloadFile(new Blob([content],{type:'text/plain'}), name);
        } else {
            let d = data.colPos === 'first' ? data.nums.map(v=>[v]) : data.nums.map(v=>['',v]);
            downloadFile(makeExcel(d,false), name);
        }
    } else {
        alert('数据已失效，请重新生成');
    }
};

document.getElementById('gen-txt-btn').onclick = () => doGenerate('txt');
document.getElementById('gen-excel-btn').onclick = () => doGenerate('excel');
document.getElementById('gen-reset').onclick = () => {
    genFilename.value = ''; genRules.value = '开头'; genFilelist.innerHTML = '';
    document.getElementById('stat-total').textContent = '0';
    document.getElementById('stat-files').textContent = '0';
    document.getElementById('stat-groups').textContent = '0';
    document.getElementById('stat-unique').textContent = '0';
    genStatus.textContent = '等待生成'; genProgress.style.width = '0%';
    genLastManual = ''; updateGenName();
};
document.getElementById('gen-area-on').onclick = () => { genAreaOn=true; updateGenName(); };
document.getElementById('gen-area-off').onclick = () => { genAreaOn=false; updateGenName(); };
genRules.oninput = () => { clearTimeout(window._fnTimer); window._fnTimer = setTimeout(updateGenName, 100); };
genFilename.oninput = () => { genLastManual = genFilename.value; };
document.querySelectorAll('#gen-quick-size .quick-btn').forEach(btn => {
    btn.onclick = function() { document.querySelectorAll('#gen-quick-size .quick-btn').forEach(b=>b.classList.remove('active')); this.classList.add('active'); };
});
document.querySelectorAll('#gen-quick-col .quick-btn').forEach(btn => {

// ========== 单文件去重 ==========
let dedupFiles = [];
const dedupArea = document.getElementById('dedup-area');
const dedupInput = document.createElement('input');
dedupInput.type = 'file';
dedupInput.multiple = true;
dedupInput.accept = '.xlsx,.xls,.txt,.csv';
dedupInput.style.display = 'none';
document.body.appendChild(dedupInput);

function processDedup(files) {
    const results = document.getElementById('dedup-results');
    results.innerHTML = '';
    const col = document.querySelector('#panel-dedup .quick-btn[data-col]')?.dataset.col === 'second' ? 1 : 0;
    let done = 0;
    files.forEach(file => {
        readFile(file, col, (err, data) => {
            if(err) { results.innerHTML += `<div class="result-card">${file.name} 解析失败</div>`; done++; return; }
            const uniq = unique(data);
            const id = nextId++;
            window.fileData[id] = { nums: uniq };
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `<div><strong>${file.name}</strong> 原:${data.length} → 去重:${uniq.length}</div><div class="btn-group" style="margin-top:8px"><button class="btn-primary" onclick="downloadDedupTxt(${id}, '${file.name.replace(/\.[^/.]+$/,'')}_去重.txt')">下载TXT</button><button class="btn-primary" onclick="downloadDedupExcel(${id}, '${file.name.replace(/\.[^/.]+$/,'')}_去重.xlsx')">下载Excel</button></div>`;
            results.appendChild(card);
            done++;
            document.getElementById('dedup-progress').style.width = (done/files.length*100)+'%';
        });
    });
}
window.downloadDedupTxt = (id, name) => { let d = window.fileData[id]; if(d) downloadFile(new Blob([d.nums.join('\n')],{type:'text/plain'}), name); };
window.downloadDedupExcel = (id, name) => { let d = window.fileData[id]; if(d) downloadFile(makeExcel(d.nums, true), name); };

dedupArea.onclick = () => { dedupInput.value = ''; dedupInput.click(); };

dedupArea.ondragover = e => e.preventDefault();
dedupArea.ondrop = e => {
    e.preventDefault();
    let files = Array.from(e.dataTransfer.files).filter(f=>/\.(xlsx|xls|txt|csv)$/i.test(f.name));
    if(files.length) processDedup(files);
};
document.getElementById('dedup-reset').onclick = () => { dedupFiles = []; document.getElementById('dedup-results').innerHTML = ''; document.getElementById('dedup-progress').style.width = '0%'; };

// ========== 前缀分类 ==========
let classifyFiles = [], classifyNums = [], classifySort = 'asc', classifyPrefix = '', classifyArea = true;
const classifyAreaDiv = document.getElementById('classify-area');
const classifyInput = document.createElement('input');
classifyInput.type = 'file';
classifyInput.multiple = true;
classifyInput.accept = '.xlsx,.xls,.txt,.csv';
classifyInput.style.display = 'none';
document.body.appendChild(classifyInput);

function renderClassify() {
    if(!classifyNums.length) return;
    const len = parseInt(document.getElementById('classify-len').value);
    const groups = {};
    for(let n of classifyNums) if(n.length>=len) { let k=n.slice(0,len); if(!groups[k]) groups[k]=[]; groups[k].push(n); }
    let entries = Object.entries(groups);
    if(classifySort === 'asc') entries.sort((a,b)=>a[0].localeCompare(b[0]));
    else if(classifySort === 'shuffle') for(let i=entries.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[entries[i],entries[j]]=[entries[j],entries[i]];}
    document.getElementById('classify-stats').style.display = 'grid';
    document.getElementById('classify-stats').innerHTML = `<div class="stat-card"><div class="stat-number">${classifyFiles.length}</div><div>文件数</div></div><div class="stat-card"><div class="stat-number">${classifyNums.length}</div><div>总号码</div></div><div class="stat-card"><div class="stat-number">${Object.keys(groups).length}</div><div>前缀数</div></div>`;
    const listDiv = document.getElementById('classify-list');
    listDiv.innerHTML = '';
    for(let [k,nums] of entries) {
        let display = k;
        if(classifyArea) { let a = getArea(k); if(a) display = `${k}(${a})`; }
        const id = nextId++;
        window.fileData[id] = { nums };
        const item = document.createElement('div');
        item.className = 'result-card';
        item.innerHTML = `<div><strong>${display}</strong> ${nums.length}个</div><div class="btn-group" style="margin-top:8px"><button class="btn-primary" onclick="downloadClassifyTxt(${id}, '${classifyPrefix}${k}${classifyArea?(getArea(k)?'_'+getArea(k):''):''}_${nums.length}个.txt')">TXT</button><button class="btn-primary" onclick="downloadClassifyExcel(${id}, '${classifyPrefix}${k}${classifyArea?(getArea(k)?'_'+getArea(k):''):''}_${nums.length}个.xlsx')">Excel</button></div>`;
        listDiv.appendChild(item);
    }
}
window.downloadClassifyTxt = (id, name) => { let d = window.fileData[id]; if(d) { let sorted = classifySort==='shuffle'?shuffle([...d.nums]):[...d.nums].sort(); downloadFile(new Blob([sorted.join('\n')],{type:'text/plain'}), name); } };
window.downloadClassifyExcel = (id, name) => { let d = window.fileData[id]; if(d) { let sorted = classifySort==='shuffle'?shuffle([...d.nums]):[...d.nums].sort(); let full = document.getElementById('classify-full')?.checked; let data = full ? sorted.map(n=>[n]) : [[`前缀 ${name.split('_')[0]}`]]; downloadFile(makeExcel(data,true), name); } };

function parseAllClassify() {
    const col = document.querySelector('#panel-classify .quick-btn[data-class-col].active')?.dataset.classCol === 'second' ? 1 : 0;
    let all = [], done = 0;
    if(!classifyFiles.length) return;
    classifyFiles.forEach(file => {
        readFile(file, col, (err, data) => {
            if(data) all = all.concat(data);
            done++;
            document.getElementById('classify-progress').style.width = (done/classifyFiles.length*100)+'%';
            if(done === classifyFiles.length) { classifyNums = all; renderClassify(); }
        });
    });
}

classifyAreaDiv.onclick = () => { classifyInput.value = ''; classifyInput.click(); };
classifyInput.onchange = e => { if(e.target.files.length) { classifyFiles = Array.from(e.target.files); parseAllClassify(); } classifyInput.value = ''; };
classifyAreaDiv.ondragover = e => e.preventDefault();
classifyAreaDiv.ondrop = e => {
    e.preventDefault();
    let files = Array.from(e.dataTransfer.files).filter(f=>/\.(xlsx|xls|txt|csv)$/i.test(f.name));
    if(files.length) { classifyFiles = files; parseAllClassify(); }
};
document.getElementById('sort-asc').onclick = () => { classifySort='asc'; renderClassify(); };
document.getElementById('sort-shuffle').onclick = () => { classifySort='shuffle'; renderClassify(); };
document.querySelectorAll('#panel-classify .quick-btn[data-prefix]').forEach(btn => {
    btn.onclick = function() { document.querySelectorAll('#panel-classify .quick-btn[data-prefix]').forEach(b=>b.classList.remove('active')); this.classList.add('active'); classifyPrefix = this.dataset.prefix ? this.dataset.prefix+'_' : ''; renderClassify(); };
});
document.querySelectorAll('#panel-classify .quick-btn[data-class-col]').forEach(btn => {
    btn.onclick = function() { document.querySelectorAll('#panel-classify .quick-btn[data-class-col]').forEach(b=>b.classList.remove('active')); this.classList.add('active'); if(classifyFiles.length) parseAllClassify(); };
});
document.getElementById('classify-len').onchange = () => { if(classifyFiles.length) renderClassify(); };
document.getElementById('classify-area-on').onclick = () => { classifyArea=true; renderClassify(); };
document.getElementById('classify-area-off').onclick = () => { classifyArea=false; renderClassify(); };
document.getElementById('classify-all-txt').onclick = () => {
    const len = parseInt(document.getElementById('classify-len').value);
    const groups = {};
    for(let n of classifyNums) if(n.length>=len) { let k=n.slice(0,len); if(!groups[k]) groups[k]=[]; groups[k].push(n); }
    for(let [k,nums] of Object.entries(groups)) {
        let sorted = classifySort==='shuffle'?shuffle([...nums]):[...nums].sort();
        let area = classifyArea ? (getArea(k)||'') : '';
        downloadFile(new Blob([sorted.join('\n')],{type:'text/plain'}), `${classifyPrefix}${k}${area?'_'+area:''}_${nums.length}个.txt`);
    }
};
document.getElementById('classify-all-xlsx').onclick = () => {
    const len = parseInt(document.getElementById('classify-len').value);
    const groups = {};
    for(let n of classifyNums) if(n.length>=len) { let k=n.slice(0,len); if(!groups[k]) groups[k]=[]; groups[k].push(n); }
    for(let [k,nums] of Object.entries(groups)) {
        let sorted = classifySort==='shuffle'?shuffle([...nums]):[...nums].sort();
        let area = classifyArea ? (getArea(k)||'') : '';
        let data = document.getElementById('classify-full')?.checked ? sorted.map(n=>[n]) : [[`前缀 ${k}`]];
        downloadFile(makeExcel(data,true), `${classifyPrefix}${k}${area?'_'+area:''}_${nums.length}个.xlsx`);
    }
};
document.getElementById('classify-reset').onclick = () => { classifyFiles = []; classifyNums = []; document.getElementById('classify-list').innerHTML = ''; document.getElementById('classify-stats').style.display = 'none'; document.getElementById('classify-progress').style.width = '0%'; };

// 添加包含完整号码选项
const classifyFullDiv = document.createElement('div');
classifyFullDiv.className = 'form-group';
classifyFullDiv.innerHTML = '<label>包含完整号码</label><div class="quick-btns"><span class="quick-btn active" id="classify-full-on">开启</span><span class="quick-btn" id="classify-full-off">关闭</span></div>';
document.querySelector('#panel-classify .row:last-child').after(classifyFullDiv);
let classifyFull = true;
document.getElementById('classify-full-on').onclick = () => { classifyFull=true; };
document.getElementById('classify-full-off').onclick = () => { classifyFull=false; };
window.classifyFull = classifyFull;

// ========== 双文件去重 ==========
let dupData1 = null, dupData2 = null;
function setupDupArea(areaId, nameId, fileKey) {
    const area = document.getElementById(areaId);
    const nameSpan = document.getElementById(nameId);
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xlsx,.xls,.txt,.csv';
    input.style.display = 'none';
    document.body.appendChild(input);
    area.onclick = () => { input.value = ''; input.click(); };
    input.onchange = e => {
        let f = e.target.files[0];
        if(!f) return;
        nameSpan.textContent = f.name;
        readFileFull(f, (err, data) => {
            if(!err) {
                let nums = [];
                for(let i=0;i<data.length;i++) { let v = data[i][0]?.toString().trim(); if(v) nums.push(v); }
                if(fileKey === 'f1') dupData1 = { name: f.name, data: nums, raw: data };
                else dupData2 = { name: f.name, data: nums, raw: data };
            }
            checkDupReady();
        });
        input.value = '';
    };
    area.ondragover = e => e.preventDefault();
    area.ondrop = e => {
        e.preventDefault();
        let f = Array.from(e.dataTransfer.files).find(f=>/\.(xlsx|xls|txt|csv)$/i.test(f.name));
        if(f) {
            nameSpan.textContent = f.name;
            readFileFull(f, (err, data) => {
                if(!err) {
                    let nums = [];
                    for(let i=0;i<data.length;i++) { let v = data[i][0]?.toString().trim(); if(v) nums.push(v); }
                    if(fileKey === 'f1') dupData1 = { name: f.name, data: nums, raw: data };
                    else dupData2 = { name: f.name, data: nums, raw: data };
                }
                checkDupReady();
            });
        }
    };
}
function checkDupReady() { document.getElementById('dup-process').disabled = !(dupData1 && dupData2); }
setupDupArea('dup-area1', 'dup-name1', 'f1');
setupDupArea('dup-area2', 'dup-name2', 'f2');
document.getElementById('dup-clear').onclick = () => { dupData1 = null; dupData2 = null; document.getElementById('dup-name1').textContent = '未选择'; document.getElementById('dup-name2').textContent = '未选择'; document.getElementById('dup-download').style.display = 'none'; document.getElementById('dup-process').disabled = true; };
document.getElementById('dup-process').onclick = () => {
    if(!dupData1 || !dupData2) return;
    const set1 = new Set(dupData1.data);
    const set2 = new Set(dupData2.data);
    const common = new Set();
    for(let x of set1) if(set2.has(x)) common.add(x);
    const f1f = dupData1.raw.filter(r => { let v = r[0]?.toString().trim(); return v && !common.has(v); });
    const f2f = dupData2.raw.filter(r => { let v = r[0]?.toString().trim(); return v && !common.has(v); });
    const blob1t = new Blob([f1f.map(r=>r.join('\t')).join('\n')], {type:'text/plain'});
    const blob1x = makeExcel(f1f, false);
    const blob2t = new Blob([f2f.map(r=>r.join('\t')).join('\n')], {type:'text/plain'});
    const blob2x = makeExcel(f2f, false);
    document.getElementById('dup-dl1-txt').onclick = () => downloadFile(blob1t, dupData1.name.replace(/\.[^/.]+$/,'')+'_去重.txt');
    document.getElementById('dup-dl1-xlsx').onclick = () => downloadFile(blob1x, dupData1.name.replace(/\.[^/.]+$/,'')+'_去重.xlsx');
    document.getElementById('dup-dl2-txt').onclick = () => downloadFile(blob2t, dupData2.name.replace(/\.[^/.]+$/,'')+'_去重.txt');
    document.getElementById('dup-dl2-xlsx').onclick = () => downloadFile(blob2x, dupData2.name.replace(/\.[^/.]+$/,'')+'_去重.xlsx');
    document.getElementById('dup-download').style.display = 'block';
};

// ========== 前导0 ==========
let zeroFilesList = [];
const zeroAreaDiv = document.getElementById('zero-area');
const zeroInputFile = document.createElement('input');
zeroInputFile.type = 'file';
zeroInputFile.multiple = true;
zeroInputFile.accept = '.xlsx,.xls,.txt,.csv';
zeroInputFile.style.display = 'none';
document.body.appendChild(zeroInputFile);

function processZero(action) {
    if(!zeroFilesList.length) { alert('请先上传文件'); return; }
    const results = document.getElementById('zero-results');
    results.innerHTML = '';
    const col = document.querySelector('#panel-zero .quick-btn[data-zero-col].active')?.dataset.zeroCol === 'second' ? 1 : 0;
    let done = 0;
    zeroFilesList.forEach(file => {
        readFileFull(file, (err, data) => {
            if(err) { results.innerHTML += `<div class="result-card">${file.name} 解析失败</div>`; done++; return; }
            let processed = data.map(row => {
                if(row.length <= col) return row;
                let v = row[col]?.toString().trim() || '';
                if(action === 'add') { if(/^\d+$/.test(v)) row[col] = '0'+v; }
                else { if(/^0+\d+$/.test(v)) row[col] = v.replace(/^0+/, ''); }
                return row;
            });
            const id = nextId++;
            window.fileData[id] = { processed };
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `<div><strong>${file.name}</strong> 处理完成</div><div class="btn-group" style="margin-top:8px"><button class="btn-primary" onclick="downloadZeroTxt(${id}, '${file.name.replace(/\.[^/.]+$/,'')}_处理后.txt')">下载TXT</button><button class="btn-primary" onclick="downloadZeroExcel(${id}, '${file.name.replace(/\.[^/.]+$/,'')}_处理后.xlsx')">下载Excel</button></div>`;
            results.appendChild(card);
            done++;
            document.getElementById('zero-progress').style.width = (done/zeroFilesList.length*100)+'%';
        });
    });
}
window.downloadZeroTxt = (id, name) => { let d = window.fileData[id]; if(d) downloadFile(new Blob([d.processed.map(r=>r.join('\t')).join('\n')],{type:'text/plain'}), name); };
window.downloadZeroExcel = (id, name) => { let d = window.fileData[id]; if(d) downloadFile(makeExcel(d.processed, false), name); };

zeroAreaDiv.onclick = () => { zeroInputFile.value = ''; zeroInputFile.click(); };
zeroInputFile.onchange = e => { if(e.target.files.length) { zeroFilesList = Array.from(e.target.files); processZero('add'); } zeroInputFile.value = ''; };
zeroAreaDiv.ondragover = e => e.preventDefault();
zeroAreaDiv.ondrop = e => {
    e.preventDefault();
    let files = Array.from(e.dataTransfer.files).filter(f=>/\.(xlsx|xls|txt|csv)$/i.test(f.name));
    if(files.length) { zeroFilesList = files; processZero('add'); }
};
document.getElementById('zero-add').onclick = () => { if(zeroFilesList.length) processZero('add'); else alert('请先上传文件'); };
document.getElementById('zero-remove').onclick = () => { if(zeroFilesList.length) processZero('remove'); else alert('请先上传文件'); };
document.getElementById('zero-reset').onclick = () => { zeroFilesList = []; document.getElementById('zero-results').innerHTML = ''; document.getElementById('zero-progress').style.width = '0%'; };
document.querySelectorAll('#panel-zero .quick-btn[data-zero-col]').forEach(btn => {
    btn.onclick = function() { document.querySelectorAll('#panel-zero .quick-btn[data-zero-col]').forEach(b=>b.classList.remove('active')); this.classList.add('active'); };
});

// ========== 首列编辑 ==========
let firstFiles = [];
const firstAreaDiv = document.getElementById('first-area');
const firstInputFile = document.createElement('input');
firstInputFile.type = 'file';
firstInputFile.multiple = true;
firstInputFile.accept = '.xlsx,.xls,.txt,.csv';
firstInputFile.style.display = 'none';
document.body.appendChild(firstInputFile);

function processFirst(action) {
    if(!firstFiles.length) { alert('请先上传文件'); return; }
    const results = document.getElementById('first-results');
    results.innerHTML = '';
    let done = 0;
    firstFiles.forEach(file => {
        readFileFull(file, (err, data) => {
            if(err) { results.innerHTML += `<div class="result-card">${file.name} 解析失败</div>`; done++; return; }
            let processed = action === 'insert' ? data.map(row => ['', ...row]) : data.map(row => row.slice(1));
            const id = nextId++;
            window.fileData[id] = { processed };
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `<div><strong>${file.name}</strong> 处理完成</div><div class="btn-group" style="margin-top:8px"><button class="btn-primary" onclick="downloadFirstTxt(${id}, '${file.name.replace(/\.[^/.]+$/,'')}_处理后.txt')">下载TXT</button><button class="btn-primary" onclick="downloadFirstExcel(${id}, '${file.name.replace(/\.[^/.]+$/,'')}_处理后.xlsx')">下载Excel</button></div>`;
            results.appendChild(card);
            done++;
            document.getElementById('first-progress').style.width = (done/firstFiles.length*100)+'%';
        });
    });
}
window.downloadFirstTxt = (id, name) => { let d = window.fileData[id]; if(d) downloadFile(new Blob([d.processed.map(r=>r.join('\t')).join('\n')],{type:'text/plain'}), name); };
window.downloadFirstExcel = (id, name) => { let d = window.fileData[id]; if(d) downloadFile(makeExcel(d.processed, false), name); };

firstAreaDiv.onclick = () => { firstInputFile.value = ''; firstInputFile.click(); };
firstInputFile.onchange = e => { if(e.target.files.length) { firstFiles = Array.from(e.target.files); processFirst('insert'); } firstInputFile.value = ''; };
firstAreaDiv.ondragover = e => e.preventDefault();
firstAreaDiv.ondrop = e => {
    e.preventDefault();
    let files = Array.from(e.dataTransfer.files).filter(f=>/\.(xlsx|xls|txt|csv)$/i.test(f.name));
    if(files.length) { firstFiles = files; processFirst('insert'); }
};
document.getElementById('first-insert').onclick = () => { if(firstFiles.length) processFirst('insert'); else alert('请先上传文件'); };
document.getElementById('first-delete').onclick = () => { if(firstFiles.length) processFirst('delete'); else alert('请先上传文件'); };
document.getElementById('first-reset').onclick = () => { firstFiles = []; document.getElementById('first-results').innerHTML = ''; document.getElementById('first-progress').style.width = '0%'; };

// ========== 标签切换 ==========
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = function() {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));

// 初始化
updateGenName();
</script>
