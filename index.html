<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP追剧神器 - 浏览器纯网页版（2026更新）</title>
    <link href="https://cdn.jsdelivr.net/npm/video.js@8.10.0/dist/video-js.min.css" rel="stylesheet">
    <style>
        body { font-family: "微软雅黑", Arial, sans-serif; background: #f4f7fa; margin: 0; padding: 15px; }
        .container { max-width: 1280px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 6px 25px rgba(0,0,0,0.12); overflow: hidden; }
        header { background: linear-gradient(135deg, #0d6efd, #6610f2); color: white; padding: 25px; text-align: center; }
        header h1 { margin: 0; font-size: 30px; }
        .input-area { padding: 20px; background: #f8f9fa; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        input[type="text"] { flex: 1; padding: 14px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; min-width: 400px; }
        button { padding: 14px 24px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .parse-btn { background: #0d6efd; color: white; }
        .play-btn { background: #198754; color: white; }
        .switch-btn { background: #6c757d; color: white; }
        .clear-btn { background: #dc3545; color: white; }
        .status { padding: 12px 20px; font-size: 16px; background: #fff3cd; color: #856404; min-height: 28px; }
        .player-container { padding: 20px; background: #000; }
        .video-js { width: 100% !important; height: 560px !important; }
        .result { padding: 20px; border-top: 1px solid #eee; }
        textarea { width: 100%; height: 140px; font-family: Consolas, monospace; font-size: 14px; resize: vertical; }
        .tips { font-size: 14px; color: #555; padding: 15px 20px; background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 VIP追剧神器（浏览器纯网页版 2026）</h1>
            <p>无需安装 • 无需会员 • 支持爱奇艺、腾讯视频、优酷等 • 解析失败多切换接口</p>
        </header>

        <div class="input-area">
            <input type="text" id="videoUrl" placeholder="粘贴VIP视频完整链接..." value="https://v.qq.com/x/cover/mzc00200k5v2z4z/m0034z9zq0z.html">
            <button class="parse-btn" onclick="parseVideo()">一键解析</button>
            <button class="switch-btn" onclick="switchApi()">切换接口</button>
            <button class="clear-btn" onclick="clearAll()">清空</button>
        </div>

        <div class="status" id="status">就绪 - 粘贴链接后点击“一键解析”</div>

        <div class="player-container">
            <video id="player" class="video-js vjs-default-skin" controls preload="auto" data-setup='{"fluid": true, "playbackRates": [0.5, 1, 1.25, 1.5, 2]}'>
            </video>
        </div>

        <div class="result">
            <p><strong>当前接口：</strong> <span id="currentApi">萝卜影视（推荐）</span></p>
            <textarea id="resultArea" readonly placeholder="解析结果将在这里显示..."></textarea>
            <button class="play-btn" onclick="playParsedUrl()" style="margin-top:12px;">▶ 在网页中直接播放</button>
        </div>

        <div class="tips">
            <strong>使用小贴士：</strong><br>
            • 复制视频播放页的**完整链接**（不是分享短链）<br>
            • 免费接口不稳定，失败时请点击“切换接口”重试<br>
            • 推荐优先试“萝卜影视”或“黑米解析”<br>
            • 支持m3u8/mp4格式，播放中可调节倍速、全屏
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/video.js@8.10.0/dist/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@videojs/http-streaming@3.12.0/dist/videojs-http-streaming.min.js"></script>

    <script>
        // 2026年更新后的更有效接口列表（优先稳定/推荐的排前面）
        const parseApis = [
            "https://ys.lbbb.cc/?url=",                    // 萝卜影视（推荐）
            "https://www.myxin.top/jx/api/?url=",          // 黑米解析
            "https://vip.52jiexi.top/?url=",               // 52解析
            "https://jx.xmflv.com/?url=",                  // 虾米
            "https://jx.m3u8.tv/jiexi/?url=",              // m3u8.tv
            "https://www.yemu.xyz/?url=",                  // 夜幕（稳定）
            "https://okjx.cc/?url=",                       // OK解析
            "http://jx.kkqtv.com/jx/api/?url=",            // 快快
            "https://jx.618g.com/?url=",                   // 618G
            "http://jx.drgxj.com/?url="                    // drgxj
        ];

        let currentIndex = 0;
        let currentPlayUrl = "";

        const player = videojs('player', {
            controls: true,
            autoplay: false,
            preload: 'auto',
            fluid: true,
            playbackRates: [0.5, 1, 1.25, 1.5, 2]
        });

        function getCurrentApiName() {
            const api = parseApis[currentIndex];
            if (api.includes('lbbb')) return "萝卜影视（推荐）";
            if (api.includes('myxin')) return "黑米解析";
            if (api.includes('52jiexi')) return "52解析";
            if (api.includes('yemu')) return "夜幕解析";
            if (api.includes('m3u8.tv')) return "m3u8.tv";
            return `接口 ${currentIndex + 1}`;
        }

        function updateApiDisplay() {
            document.getElementById('currentApi').textContent = getCurrentApiName();
        }

        async function parseVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            if (!url || !url.startsWith('http')) {
                alert("请输入正确的视频链接！");
                return;
            }

            const status = document.getElementById('status');
            const resultArea = document.getElementById('resultArea');
            status.textContent = "正在尝试解析...";
            resultArea.value = "请求解析接口中...\n";

            try {
                const encodedUrl = encodeURIComponent(url);
                const parseUrl = parseApis[currentIndex] + encodedUrl;

                const response = await fetch(parseUrl, {
                    method: 'GET',
                    headers: {
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36'
                    }
                });

                let body = await response.text();
                resultArea.value += "接口返回（前800字符）：\n" + body.substring(0, 800) + (body.length > 800 ? '...' : '') + "\n\n";

                // 智能提取真实播放地址（支持多种JSON格式和直接m3u8）
                let realUrl = null;
                try {
                    const json = JSON.parse(body);
                    realUrl = json.url || json.m3u8 || json.playUrl || 
                             (json.data && (json.data.url || json.data.m3u8 || json.data.playUrl)) ||
                             (json.result && json.result.url);
                } catch (e) {
                    // 非JSON时尝试正则提取http开头的m3u8/mp4
                    const match = body.match(/https?:\/\/[^\s"']+\.(m3u8|mp4)[^\s"']*/i);
                    if (match) realUrl = match[0];
                }

                if (realUrl && realUrl.startsWith('http')) {
                    if (realUrl.startsWith('//')) realUrl = 'https:' + realUrl;
                    currentPlayUrl = realUrl;
                    resultArea.value += `✅ 解析成功！\n真实地址：\n${realUrl}\n\n现在点击下方“在网页中直接播放”即可观看`;
                    status.textContent = "✅ 解析成功！可以播放了";
                } else {
                    resultArea.value += "⚠️ 本接口未提取到有效地址，请点击“切换接口”重试";
                    status.textContent = "解析失败，建议切换接口";
                }
            } catch (err) {
                resultArea.value += `❌ 请求异常：${err.message}\n建议切换接口重试`;
                status.textContent = "接口请求失败";
            }
        }

        function playParsedUrl() {
            if (!currentPlayUrl) {
                alert("请先解析成功后再播放！");
                return;
            }
            const type = currentPlayUrl.endsWith('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
            player.src({ src: currentPlayUrl, type: type });
            player.play().catch(e => alert("播放失败：可能是地址过期或浏览器限制，请重试解析"));
        }

        function switchApi() {
            currentIndex = (currentIndex + 1) % parseApis.length;
            updateApiDisplay();
            document.getElementById('status').textContent = `已切换 → ${getCurrentApiName()}，请重新解析`;
        }

        function clearAll() {
            document.getElementById('videoUrl').value = "";
            document.getElementById('resultArea').value = "";
            currentPlayUrl = "";
            player.pause();
            document.getElementById('status').textContent = "已清空";
        }

        // 初始化
        window.onload = updateApiDisplay;
    </script>
</body>
</html>
