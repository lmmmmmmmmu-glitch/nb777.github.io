<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>⚡ 极速数据处理</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        /* 样式保持不变 */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: linear-gradient(135deg, #e6f0fa 0%, #b8d9f5 100%);
            margin: 0;
            padding: 10px;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        @media (min-width: 768px) {
            .container {
                padding: 35px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
                border-radius: 12px;
            }
            body {
                padding: 5px;
            }
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #4d90fe, #34a853, #fbbc05, #ea4335);
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
            padding-bottom: 15px;
            border-bottom: 1px solid #eaeaea;
            font-weight: 700;
            position: relative;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
        }
        
        @media (max-width: 480px) {
            h1 {
                padding-bottom: 10px;
                margin-bottom: 15px;
            }
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            max-width: 30%;
            height: 4px;
            background: linear-gradient(90deg, #4d90fe, #34a853);
            border-radius: 2px;
        }
        
        .tool-tabs {
            display: flex;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .tool-tab {
            flex: 1 1 auto;
            min-width: 120px;
            padding: 12px 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
            color: #666;
            font-size: clamp(0.9rem, 3vw, 1rem);
            white-space: nowrap;
        }
        
        @media (max-width: 600px) {
            .tool-tab {
                min-width: calc(50% - 5px);
                white-space: normal;
                padding: 10px 8px;
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 380px) {
            .tool-tab {
                min-width: 100%;
            }
        }
        
        .tool-tab:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }
        
        .tool-tab.active {
            background-color: white;
            color: #4d90fe;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .tool-panel {
            display: none;
        }
        
        .tool-panel.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        .input-section {
            margin-bottom: 25px;
        }
        
        .input-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .input-group {
            flex: 1 1 250px;
            min-width: 250px;
        }
        
        @media (max-width: 600px) {
            .input-group {
                min-width: 100%;
            }
            .input-row {
                gap: 15px;
            }
        }
        
        .input-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            font-size: clamp(0.95rem, 3vw, 1rem);
        }
        
        .filename-input, .number-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            -webkit-appearance: none;
            appearance: none;
        }
        
        @media (max-width: 480px) {
            .filename-input, .number-input {
                padding: 10px 12px;
                font-size: 15px;
            }
        }
        
        .filename-input:focus, .number-input:focus {
            border-color: #4d90fe;
            box-shadow: 0 0 0 3px rgba(77, 144, 254, 0.2);
            outline: none;
        }
        
        .filename-hint {
            font-size: 13px;
            color: #666;
            margin-top: 6px;
        }
        
        .quick-buttons, .column-quick-buttons, .action-buttons, .filename-prefix-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .quick-btn, .column-quick-btn, .action-btn, .prefix-btn {
            padding: 6px 12px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border: 1px solid #d0d7de;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            color: #444;
            cursor: pointer;
            transition: all 0.2s;
            flex: 0 1 auto;
        }
        
        @media (max-width: 480px) {
            .quick-btn, .column-quick-btn, .action-btn, .prefix-btn {
                padding: 8px 10px;
                font-size: 13px;
                flex: 1 1 calc(33.333% - 6px);
                text-align: center;
            }
        }
        
        .quick-btn:hover, .column-quick-btn:hover, .action-btn:hover, .prefix-btn:hover {
            background: linear-gradient(135deg, #e2e6ea, #d0d7de);
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .quick-btn.active, .column-quick-btn.active, .prefix-btn.active {
            background: linear-gradient(135deg, #4d90fe, #357ae8);
            color: white;
            border-color: #4d90fe;
        }
        
        .action-btn.add-zero {
            background: linear-gradient(135deg, #34a853, #2e8b47);
            color: white;
            border-color: #2e8b47;
        }
        
        .action-btn.remove-zero {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            border-color: #d32f2f;
        }
        
        .action-btn.insert-first {
            background: linear-gradient(135deg, #4d90fe, #357ae8);
            color: white;
            border-color: #357ae8;
        }
        
        .action-btn.delete-first {
            background: linear-gradient(135deg, #ea4335, #d32f2f);
            color: white;
            border-color: #d32f2f;
        }
        
        .column-radio-hidden {
            display: none;
        }
        
        .label-with-btn {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .label-with-btn .input-label {
            margin-bottom: 0;
        }
        
        .add-prefix-btn {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            border: none;
            border-radius: 24px;
            padding: 5px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(244, 67, 54, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }
        
        .add-prefix-btn:hover {
            background: linear-gradient(135deg, #e53935, #c62828);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(244, 67, 54, 0.4);
        }
        
        .filename-auto-hint {
            font-size: 12px;
            color: #4d90fe;
            margin-top: 4px;
            font-style: italic;
            font-weight: 500;
        }
        
        textarea {
            width: 100%;
            min-height: 250px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            line-height: 1.5;
            resize: vertical;
            transition: all 0.3s;
            -webkit-appearance: none;
            appearance: none;
        }
        
        @media (max-width: 480px) {
            textarea {
                min-height: 180px;
                padding: 12px;
                font-size: 15px;
            }
        }
        
        textarea:focus {
            border-color: #4d90fe;
            box-shadow: 0 0 0 3px rgba(77, 144, 254, 0.2);
            outline: none;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 0 1 auto;
            min-width: 140px;
        }
        
        @media (max-width: 600px) {
            button {
                width: 100%;
                padding: 12px 16px;
                font-size: 15px;
                min-width: auto;
            }
            .controls {
                gap: 10px;
            }
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .generate-btn, .download-btn, .upload-btn { 
            background: linear-gradient(135deg, #4d90fe, #357ae8); 
            color: white; 
        }

        .generate-txt-btn {
            background: linear-gradient(135deg, #34a853, #2e8b47);
            color: white;
        }
        
        .reset-btn { 
            background: white; 
            color: #444; 
            border: 2px solid #e0e0e0; 
        }
        
        .sort-btn { 
            background: white; 
            color: #444; 
            border: 2px solid #e0e0e0; 
        }
        
        .sort-btn.active { 
            background: linear-gradient(135deg, #4d90fe, #357ae8); 
            color: white; 
            border-color: #4d90fe; 
        }
        
        .duplicate-btn { 
            background: linear-gradient(135deg, #4ecdc4, #44a08d); 
            color: white; 
        }
        
        .download-clean-btn, .download-all-btn { 
            background: linear-gradient(135deg, #34a853, #2e8b47); 
            color: white; 
        }
        
        .status-section {
            margin-top: 25px;
        }
        
        .status-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .status-title {
            font-weight: 700;
            color: #2c3e50;
            font-size: clamp(1rem, 3vw, 1.1rem);
        }
        
        .status-text {
            font-weight: 600;
            color: #4d90fe;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }
        
        .progress-container {
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4d90fe, #34a853);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 5px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        
        @media (max-width: 480px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
        
        .stat-box {
            background: linear-gradient(135deg, #f8f9fa, #f0f2f5);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #eaeaea;
        }
        
        @media (max-width: 480px) {
            .stat-box {
                padding: 10px;
            }
        }
        
        .stat-value {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 800;
            color: #4d90fe;
            margin-bottom: 5px;
            word-break: break-word;
        }
        
        .stat-label {
            font-size: clamp(0.8rem, 2.5vw, 0.9rem);
            color: #666;
        }
        
        .filter-stat-box {
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            border-color: #ef9a9a;
        }
        
        .filter-stat-value {
            color: #d32f2f;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4d90fe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        
        .loading-text {
            font-size: 16px;
            font-weight: 600;
            color: #444;
        }
        
        .file-list {
            margin-top: 25px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 10px;
        }
        
        .file-list-header {
            font-weight: 700;
            color: #2c3e50;
            font-size: clamp(1rem, 3vw, 1.1rem);
            margin-bottom: 15px;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            transition: all 0.2s;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        @media (max-width: 480px) {
            .file-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 12px 10px;
            }
            .file-item .download-btn {
                align-self: flex-end;
                width: 100%;
                text-align: center;
                padding: 10px;
            }
        }
        
        .file-item:hover {
            background-color: #f9f9f9;
        }
        
        .file-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .file-name {
            font-weight: 600;
            word-break: break-all;
        }
        
        .file-size {
            color: #666;
            font-size: 14px;
        }
        
        .upload-section, .classification-section, .duplicate-removal-section, .data-op-section, .first-col-section {
            margin-top: 30px;
        }
        
        .upload-header, .classification-header, .duplicate-header, .data-op-header, .first-col-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .upload-title, .classification-title, .duplicate-title, .data-op-title, .first-col-title {
            font-weight: 700;
            color: #2c3e50;
            font-size: clamp(1rem, 3vw, 1.1rem);
        }
        
        .upload-area, .classification-area, .duplicate-upload-box, .first-col-upload-box {
            border: 2px dashed #c3cfe2;
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        @media (max-width: 480px) {
            .upload-area, .classification-area, .duplicate-upload-box, .first-col-upload-box {
                padding: 15px;
            }
        }
        
        .upload-area:hover, .classification-area:hover, .duplicate-upload-box:hover, .first-col-upload-box:hover {
            border-color: #4d90fe;
            background-color: #f5f7fa;
        }
        
        .upload-icon, .classification-icon, .duplicate-upload-icon, .first-col-upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 480px) {
            .upload-icon, .classification-icon, .duplicate-upload-icon, .first-col-upload-icon {
                font-size: 36px;
            }
        }
        
        .upload-icon { color: #4d90fe; }
        .classification-icon { color: #ea4335; }
        .duplicate-upload-icon { color: #ccc; }
        .first-col-upload-icon { color: #34a853; }
        
        .upload-text, .classification-text, .duplicate-upload-text, .first-col-upload-text {
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            color: #666;
            margin-bottom: 10px;
        }
        
        .upload-hint, .classification-hint, .first-col-hint {
            font-size: clamp(0.8rem, 2.5vw, 0.9rem);
            color: #888;
        }
        
        .file-list-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            background-color: white;
        }
        
        .file-list-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: clamp(0.85rem, 2.5vw, 0.95rem);
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .file-list-item:last-child {
            border-bottom: none;
        }
        
        .file-list-name {
            font-weight: 600;
            color: #333;
            word-break: break-all;
            flex: 1 1 auto;
        }
        
        .file-list-count {
            color: #4d90fe;
            font-weight: 600;
            white-space: nowrap;
        }

        .column-preview {
            background: #f0f7ff;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0 15px 0;
            border: 1px solid #cce5ff;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .preview-item {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .preview-badge {
            background: #4d90fe;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }
        
        .preview-detail {
            color: #333;
        }
        
        .preview-zero {
            background: #ffd966;
            color: #333;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
        }
        
        .multi-file-results {
            margin-top: 20px;
        }
        
        .result-card {
            background-color: white;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .result-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .result-card-title {
            font-weight: 700;
            color: #2c3e50;
            word-break: break-all;
        }
        
        .result-card-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        
        @media (max-width: 480px) {
            .result-card-actions {
                flex-direction: column;
            }
            .result-download-btn {
                width: 100%;
                text-align: center;
            }
        }
        
        .result-download-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: clamp(0.85rem, 2.5vw, 0.95rem);
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .result-download-txt {
            background: #4d90fe;
            color: white;
        }
        
        .result-download-xlsx {
            background: #34a853;
            color: white;
        }
        
        .result-download-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        
        .classification-options {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .option-label {
            font-weight: 600;
            color: #444;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }
        
        .prefix-length-select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            background-color: white;
            cursor: pointer;
        }
        
        @media (max-width: 480px) {
            .prefix-length-select {
                width: 100%;
            }
            .option-group {
                width: 100%;
            }
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
            margin: 0 5px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #34a853;
            transition: 0.3s;
            border-radius: 34px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #ccc;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }
        
        .classification-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;

            // ========== 核心修复：重置文件输入框 ==========
            function resetFileInput(inputElement) {
                if (inputElement) {
                    // 关键修复：先克隆再替换，彻底清除内部状态
                    try {
                        inputElement.value = '';
                    } catch(e) {
                        // 某些浏览器可能不允许直接设置value，创建新元素替换
                        const newInput = inputElement.cloneNode(true);
                        newInput.value = '';
                        inputElement.parentNode.replaceChild(newInput, inputElement);
                        return newInput;
                    }
                }
                return inputElement;
            }
            
            // 安全下载函数 - 确保手机端每次都能正常下载
            function safeDownload(blob, filename) {
                if (!blob || !filename) return;
                try {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    // 使用click事件，延迟执行确保触发
                    setTimeout(() => {
                        link.click();
                    }, 10);
                    setTimeout(() => {
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                    }, 200);
                } catch (e) {
                    console.error('下载失败:', e);
                    // 降级方案：使用iframe
                    try {
                        const iframe = document.createElement('iframe');
                        iframe.style.display = 'none';
                        iframe.src = URL.createObjectURL(blob);
                        document.body.appendChild(iframe);
                        setTimeout(() => {
                            document.body.removeChild(iframe);
                        }, 1000);
                    } catch(e2) {}
                }
            }
            
            // 通用上传设置 - 修复手机端多次上传问题
            function setupFileUpload(areaElement, fileInputElement, selectBtnElement, onFilesSelected) {
                // 保存原始input引用
                let currentInput = fileInputElement;
                
                const handleFileSelect = (files) => {
                    if (files && files.length > 0 && onFilesSelected) {
                        onFilesSelected(files);
                    }
                    // 关键修复：每次选择后重置input，用新input替换旧input
                    setTimeout(() => {
                        if (currentInput && currentInput.parentNode) {
                            const newInput = document.createElement('input');
                            newInput.type = 'file';
                            newInput.accept = currentInput.accept;
                            newInput.multiple = currentInput.multiple;
                            newInput.style.display = 'none';
                            newInput.id = currentInput.id;
                            // 复制事件监听器
                            newInput.addEventListener('change', (e) => {
                                const files = Array.from(e.target.files);
                                if (files.length > 0 && onFilesSelected) {
                                    onFilesSelected(files);
                                }
                                // 递归重置
                                setTimeout(() => {
                                    if (newInput.parentNode) {
                                        const newerInput = document.createElement('input');
                                        newerInput.type = 'file';
                                        newerInput.accept = newInput.accept;
                                        newerInput.multiple = newInput.multiple;
                                        newerInput.style.display = 'none';
                                        newerInput.id = newInput.id;
                                        newerInput.addEventListener('change', arguments.callee);
                                        newInput.parentNode.replaceChild(newerInput, newInput);
                                        currentInput = newerInput;
                                    }
                                }, 50);
                            });
                            currentInput.parentNode.replaceChild(newInput, currentInput);
                            currentInput = newInput;
                        }
                    }, 50);
                };
                
                if (selectBtnElement) {
                    const newSelectBtn = selectBtnElement.cloneNode(true);
                    selectBtnElement.parentNode.replaceChild(newSelectBtn, selectBtnElement);
                    newSelectBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (currentInput) {
                            currentInput.click();
                        }
                    });
                }
                if (areaElement) {
                    areaElement.addEventListener('click', (e) => {
                        if (e.target.tagName !== 'BUTTON' && e.target !== newSelectBtn) {
                            if (currentInput) {
                                currentInput.click();
                            }
                        }
                    });
                }
                if (currentInput) {
                    currentInput.addEventListener('change', (e) => {
                        const files = Array.from(e.target.files);
                        handleFileSelect(files);
                    });
                }
                if (areaElement) {
                    areaElement.addEventListener('dragover', (e) => e.preventDefault());
                    areaElement.addEventListener('drop', (e) => {
                        e.preventDefault();
                        const files = Array.from(e.dataTransfer.files).filter(f => /\.(xlsx|xls|txt|csv)$/i.test(f.name));
                        if (files.length > 0 && onFilesSelected) {
                            onFilesSelected(files);
                        }
                    });
                }
            }
